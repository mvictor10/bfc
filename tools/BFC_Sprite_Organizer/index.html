<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Sprite Animation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #f5f5f7;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #4f46e5;
            margin-bottom: 10px;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 600px;
        }
        .drop-zone {
            width: 100%;
            height: 120px;
            border: 3px dashed #4f46e5;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            background-color: #2a2a35;
            transition: background 0.3s, border-color 0.3s;
        }
        .drop-zone.dragover {
            background-color: #3b3b4f;
            border-color: #818cf8;
        }
        .preview-box {
            width: 100%;
            min-height: 300px;
            background-color: #111116;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 1px solid #333;
            overflow: hidden;
        }
        #sprite-img {
            max-width: 90%;
            max-height: 280px;
            object-fit: contain;
            image-rendering: pixelated; /* Mantém pixel art nítida */
        }
        .controls {
            width: 100%;
            background-color: #2a2a35;
            padding: 15px;
            border-radius: 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .control-group label {
            font-weight: 600;
        }
        input[type="range"] {
            flex-grow: 1;
            accent-color: #4f46e5;
        }
        .fps-value {
            min-width: 60px;
            text-align: right;
            font-family: monospace;
            background: #111116;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .file-list {
            font-size: 0.9rem;
            color: #a1a1aa;
            text-align: center;
            max-height: 60px;
            overflow-y: auto;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>Visualizador de Sprites</h1>
    <div class="container">
        <!-- Zona de Drop -->
        <div id="drop-zone" class="drop-zone">
            Arraste e solte as imagens (sprites) aqui <br>ou clique para selecionar
            <input type="file" id="file-input" multiple accept="image/*" style="display: none;">
        </div>

        <div id="file-list" class="file-list">Nenhuma imagem carregada</div>

        <!-- Tela de Animação -->
        <div class="preview-box">
            <img id="sprite-img" style="display: none;" alt="Preview">
            <div id="placeholder-text" style="color: #666;">Aguardando imagens...</div>
        </div>

        <!-- Controles -->
        <div class="controls">
            <div class="control-group">
                <label for="fps-slider">FPS:</label>
                <input type="range" id="fps-slider" min="1" max=60 value="12">
                <span id="fps-value" class="fps-value">12 FPS</span>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileListDiv = document.getElementById('file-list');
        const spriteImg = document.getElementById('sprite-img');
        const placeholderText = document.getElementById('placeholder-text');
        const fpsSlider = document.getElementById('fps-slider');
        const fpsValue = document.getElementById('fps-value');

        let frames = [];
        let currentFrameIndex = 0;
        let animationInterval = null;
        let fps = parseInt(fpsSlider.value);

        // Click na dropzone abre o seletor de arquivos
        dropZone.addEventListener('click', () => fileInput.click());

        // Eventos de arrastar e soltar
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        // Controle do Slider de FPS
        fpsSlider.addEventListener('input', (e) => {
            fps = parseInt(e.target.value);
            fpsValue.textContent = fps + ' FPS';
            if (frames.length > 0) {
                startAnimation();
            }
        });

        // Processar arquivos carregados
        function handleFiles(files) {
            // Converter FileList em Array e ordenar por nome para garantir a ordem correta dos frames
            const sortedFiles = Array.from(files)
                .filter(file => file.type.startsWith('image/'))
                .sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric: true, sensitivity: 'base'}));

            if (sortedFiles.length === 0) return;

            frames = [];
            currentFrameIndex = 0;
            fileListDiv.innerHTML = `Carregados ${sortedFiles.length} frames (ordenados por nome).`;

            let loadedCount = 0;
            sortedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    frames[index] = e.target.result;
                    loadedCount++;
                    
                    if (loadedCount === sortedFiles.length) {
                        placeholderText.style.display = 'none';
                        spriteImg.style.display = 'block';
                        startAnimation();
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        // Iniciar ou reiniciar loop de animação
        function startAnimation() {
            clearInterval(animationInterval);
            if (frames.length === 0) return;

            const intervalTime = 1000 / fps;
            animationInterval = setInterval(() => {
                spriteImg.src = frames[currentFrameIndex];
                currentFrameIndex = (currentFrameIndex + 1) % frames.length;
            }, intervalTime);
        }
    </script>
</body>
</html>
