[package]
name = "brazil_fight_combat"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Brazil Fight Combat contributors"]
description = "Port Rust do Brazil Fight Combat: motor de luta 2D leve para Windows"

[dependencies]
# Crates de build para converter PNG/JPEG/BMP/GIF/WebP/TIFF e ler character.json.
# Depois de compilado, não exigem DLLs específicas dessas crates ao lado do executável.
image = { version = "0.24.9", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tiff"] }
serde_json = "1.0"

[lib]
name = "bfc_engine"
path = "src/lib.rs"

[[bin]]
name = "BrazilFightCombat"
path = "src/main.rs"

[[bin]]
name = "BFCStudio"
path = "src/bin/bfc_studio.rs"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package."*"]
opt-level = 3
